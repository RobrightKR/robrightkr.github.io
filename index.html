<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robright | 로브라이트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #0123b4 -10%, #ffffff 40%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2c3e50;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }
        .logo-box {
            margin-bottom: 2.5rem;
            animation: fadeInDown 1.2s ease-out;
        }
        .logo-box img {
            max-width: 300px;
            height: auto;
        }
        .text-box {
            animation: fadeInUp 1.2s ease-out;
        }
        .title {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 1rem;
            color: #111111;
            word-break: keep-all;
        }
        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 3rem;
            word-break: keep-all;
        }
        .footer {
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 0.5px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <img src="logo.svg" alt="COMPANY LOGO">
        </div>
<!--
        <div class="text-box">
            <h1 class="title">Coming soon</h1>
            <p class="subtitle">Coming soon</p>
        </div>
-->
        <div class="footer">
            <p>© 2026 Robright. All rights reserved.</p>
        </div>
    </div>

</body>
</html>
